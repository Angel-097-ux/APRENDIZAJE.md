<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PB Factory - Gestión</title>
    <link rel="stylesheet" href="index-1.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-layout">

    <aside class="sidebar">
        <div class="sidebar__header">
            <h1 class="sidebar__title">PB<span>Factory</span></h1>
        </div>
        <nav class="sidebar__nav">
            <a href="#" class="sidebar__link sidebar__link--active">📦 Inventario</a>
            <a href="#" class="sidebar__link">📊 Reportes</a>
            <a href="#" class="sidebar__link">👥 Clientes</a>
            <a href="index.html" class="sidebar__title">PB<span>Factory</span></a>
        </nav>
    </aside>

    <main class="main-view">
        <header class="header-app">
            <input type="text" class="header-app__search" placeholder="Buscar orden...">
            <button class="btn btn--primary">+ Nueva Orden</button>
        </header>

        <section class="board">
            <div class="board__column">
                <div class="column-header"><h3>Pendiente</h3><span class="badge">3</span></div>
                <div class="card">
                    <span class="card__tag card__tag--urgente">Urgente</span>
                    <p class="card__text">Corte de 500 bodies - Arroro MV</p>
                    <div class="card__footer">📅 28 Mar</div>
                </div>
            </div>

            <div class="board__column">
                <div class="column-header"><h3>En Proceso</h3><span class="badge">1</span></div>
                <div class="card">
                    <span class="card__tag card__tag--proceso">En Taller</span>
                    <p class="card__text">Remeras estampadas Per Bimbi</p>
                    <div class="card__footer">📅 30 Mar</div>
                </div>
            </div>

            <div class="board__column">
                <div class="column-header"><h3>Finalizado</h3><span class="badge badge--success">12</span></div>
                <div class="card">
                    <span class="card__tag card__tag--exito">Listo</span>
                    <p class="card__text">Pedido Mayorista Rosario</p>
                    <div class="card__footer">✅ Completado</div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
